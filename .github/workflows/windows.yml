# Kay for Windows (windows/): builds the installer on every change to it, and publishes a release for a
# `windows-v<version>` tag. Nothing is tested here; the build is what this checks.
#
# A release is a GitHub release with the NSIS installer and its updater signature, not marked latest (the Mac's
# disk image stays the latest download), plus windows/latest.json committed to main: the feed installed copies
# poll, as appcast.xml is for the Mac.
name: Windows

on:
  push:
    branches: [main]
    paths: [windows/**, .github/workflows/windows.yml]
    tags: ['windows-v*']
  pull_request:
    paths: [windows/**, .github/workflows/windows.yml]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: windows/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/windows-v')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "windows-v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          # Without the key (a pull request from a fork) the installer is built unsigned for updates.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            pnpm tauri build
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: kay-windows
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          name: kay-windows
          path: bundle
      - name: Publish the release and the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#windows-v}
          installer=$(ls bundle/*-setup.exe)
          gh release create "$GITHUB_REF_NAME" "$installer" "$installer.sig" \
            --title "Kay for Windows $version" --latest=false --verify-tag \
            --notes "Kay for Windows $version. Download $(basename "$installer"), run it, and hold Right Alt to dictate."
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$installer")"
          jq -n --arg version "$version" --arg url "$url" --rawfile signature "$installer.sig" \
            '{version: $version, pub_date: (now | todate), platforms: {"windows-x86_64": {url: $url, signature: $signature}}}' \
            > windows/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/latest.json
          git commit -m "latest.json: Kay for Windows $version"
          git push origin main
